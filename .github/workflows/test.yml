name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        # api-comprehensive needs a running dev server and concurrency-vote needs
        # Firestore credentials, so both are run manually instead
        run: npx jest --testPathIgnorePatterns api-comprehensive concurrency-vote
